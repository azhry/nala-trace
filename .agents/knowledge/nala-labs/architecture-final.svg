<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 1800 1480" role="img" aria-labelledby="title description">
  <title id="title">Nala Labs platform architecture</title>
  <desc id="description">A fixed-layout architecture diagram for Nala Labs with alternative Cloudflare tunnel configurations, Minikube ingress, individual public services, and direct service-to-state dependencies.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.5px; fill: #172033; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #667085; }
      .section { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; fill: #98a2b3; }
      .label { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .small { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #667085; }
      .note { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #667085; }
      .card { stroke-width: 2; filter: url(#shadow); }
      .access { fill: #eef4ff; stroke: #7aa2e8; }
      .tunnel { fill: #f4efff; stroke: #9b7edb; }
      .runtime { fill: #eaf8f3; stroke: #57ad8a; }
      .service { fill: #fff7e5; stroke: #e1aa43; }
      .state { fill: #f5efff; stroke: #9b7edb; }
      .future { fill: #edf8ff; stroke: #63a9d8; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .alternative { fill: none; stroke: #9b7edb; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; }
      .flow-label { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; fill: #667085; }
    </style>
  </defs>

  <rect width="1800" height="1480" fill="#f7f9fc"/>
  <text x="80" y="62" class="title">NALA LABS / PLATFORM ARCHITECTURE</text>
  <text x="80" y="91" class="subtitle">Access routing, runtime services, and explicit dependencies</text>

  <text x="80" y="140" class="section">01 / ACCESS AND TUNNEL SELECTION</text>
  <rect x="675" y="120" width="450" height="62" rx="12" class="card access"/>
  <text x="900" y="158" text-anchor="middle" class="label">Clients</text>
  <rect x="675" y="215" width="450" height="62" rx="12" class="card access"/>
  <text x="900" y="253" text-anchor="middle" class="label">Cloudflare DNS</text>
  <path d="M900 182 V215" class="flow"/>

  <rect x="200" y="330" width="560" height="78" rx="12" class="card tunnel"/>
  <text x="480" y="363" text-anchor="middle" class="label">nala-macos</text>
  <text x="480" y="388" text-anchor="middle" class="small">base hostnames</text>
  <rect x="1040" y="330" width="560" height="78" rx="12" class="card tunnel"/>
  <text x="1320" y="363" text-anchor="middle" class="label">nala-windows</text>
  <text x="1320" y="388" text-anchor="middle" class="small">.win hostnames</text>
  <path d="M900 277 V300 H480 V330" class="flow"/>
  <path d="M900 277 V300 H1320 V330" class="flow"/>

  <rect x="650" y="455" width="500" height="64" rx="12" class="card runtime"/>
  <text x="900" y="483" text-anchor="middle" class="label">Selected tunnel token</text>
  <text x="900" y="505" text-anchor="middle" class="small">one tunnel configuration per connector deployment</text>
  <path d="M480 408 V432 H900 V455" class="alternative"/>
  <path d="M1320 408 V432 H900 V455" class="alternative"/>

  <rect x="650" y="555" width="500" height="70" rx="12" class="card runtime"/>
  <text x="900" y="584" text-anchor="middle" class="label">cloudflared connectors</text>
  <text x="900" y="607" text-anchor="middle" class="small">two replicas in the cloudflare namespace</text>
  <path d="M900 519 V555" class="flow"/>

  <text x="80" y="690" class="section">02 / MINIKUBE RUNTIME EDGE</text>
  <rect x="300" y="675" width="430" height="70" rx="12" class="card runtime"/>
  <text x="515" y="704" text-anchor="middle" class="label">NGINX Ingress</text>
  <text x="515" y="727" text-anchor="middle" class="small">HTTP • ingress-nginx namespace</text>
  <rect x="1070" y="675" width="430" height="70" rx="12" class="card runtime"/>
  <text x="1285" y="704" text-anchor="middle" class="label">Kafka broker</text>
  <text x="1285" y="727" text-anchor="middle" class="small">TCP • kafka service</text>
  <path d="M900 625 V650 H515 V675" class="flow"/>
  <path d="M900 625 V650 H1285 V675" class="flow"/>
  <text x="585" y="645" class="flow-label">HTTP</text>
  <text x="1180" y="645" class="flow-label">TCP</text>

  <text x="80" y="825" class="section">03 / INDIVIDUAL PUBLIC SERVICES</text>
  <rect x="70" y="850" width="270" height="76" rx="12" class="card service"/>
  <text x="205" y="895" text-anchor="middle" class="label">Casdoor</text>
  <rect x="380" y="850" width="270" height="76" rx="12" class="card service"/>
  <text x="515" y="895" text-anchor="middle" class="label">Flagr</text>
  <rect x="690" y="850" width="270" height="76" rx="12" class="card service"/>
  <text x="825" y="895" text-anchor="middle" class="label">Harbor</text>
  <rect x="1000" y="850" width="270" height="76" rx="12" class="card service"/>
  <text x="1135" y="895" text-anchor="middle" class="label">Vault UI</text>
  <rect x="1310" y="850" width="270" height="76" rx="12" class="card service"/>
  <text x="1445" y="895" text-anchor="middle" class="label">Kafka UI</text>
  <path d="M515 745 V805 H205 V850" class="flow"/>
  <path d="M515 805 H515 V850" class="flow"/>
  <path d="M515 805 H825 V850" class="flow"/>
  <path d="M515 805 H1135 V850" class="flow"/>
  <path d="M515 805 H1445 V850" class="flow"/>
  <path d="M1285 745 V815 H1445 V850" class="flow"/>
  <text x="80" y="975" class="section">04 / STATE SERVICES AND DEPENDENCIES</text>

  <rect x="80" y="1090" width="250" height="72" rx="12" class="card state"/>
  <text x="205" y="1123" text-anchor="middle" class="label">Shared PostgreSQL</text>
  <text x="205" y="1147" text-anchor="middle" class="small">Casdoor • Flagr • Harbor</text>
  <rect x="390" y="1090" width="220" height="72" rx="12" class="card state"/>
  <text x="500" y="1123" text-anchor="middle" class="label">Shared Redis</text>
  <text x="500" y="1147" text-anchor="middle" class="small">Harbor cache</text>
  <rect x="670" y="1090" width="220" height="72" rx="12" class="card state"/>
  <text x="780" y="1123" text-anchor="middle" class="label">Harbor registry</text>
  <text x="780" y="1147" text-anchor="middle" class="small">Persistent PVC</text>
  <rect x="970" y="1090" width="240" height="72" rx="12" class="card state"/>
  <text x="1090" y="1123" text-anchor="middle" class="label">Vault storage</text>
  <text x="1090" y="1147" text-anchor="middle" class="small">Persistent PVC</text>
  <rect x="1270" y="1090" width="250" height="72" rx="12" class="card state"/>
  <text x="1395" y="1123" text-anchor="middle" class="label">Future-app</text>
  <text x="1395" y="1147" text-anchor="middle" class="small">PostgreSQL • reserved</text>
  <rect x="1570" y="1090" width="180" height="72" rx="12" class="card state"/>
  <text x="1660" y="1123" text-anchor="middle" class="label">Shared MongoDB</text>
  <text x="1660" y="1147" text-anchor="middle" class="small">Future use</text>

  <path d="M205 926 V1090" class="flow"/>
  <path d="M515 926 V1015 H205 V1090" class="flow"/>
  <path d="M825 926 V1045 H205 V1090" class="flow"/>
  <path d="M825 926 V995 H500 V1090" class="flow"/>
  <path d="M825 926 V1090" class="flow"/>
  <path d="M1135 926 V1030 H1090 V1090" class="flow"/>
  <text x="220" y="1007" class="flow-label">DB</text>
  <text x="365" y="1037" class="flow-label">DB</text>
  <text x="620" y="987" class="flow-label">CACHE</text>
  <text x="840" y="1020" class="flow-label">IMAGES</text>
  <text x="1148" y="1020" class="flow-label">DATA</text>

  <rect x="80" y="1240" width="300" height="72" rx="12" class="card future"/>
  <text x="230" y="1275" text-anchor="middle" class="label">Future applications</text>
  <text x="230" y="1298" text-anchor="middle" class="small">planned consumers</text>
  <path d="M145 1312 V1335 H500 V1162" class="alternative" marker-end="url(#arrow)"/>
  <path d="M230 1312 V1360 H1395 V1162" class="alternative" marker-end="url(#arrow)"/>
  <path d="M315 1312 V1385 H1660 V1162" class="alternative" marker-end="url(#arrow)"/>
  <path d="M380 1276 H1780 V710 H1500" class="alternative" marker-end="url(#arrow)"/>
  <text x="400" y="1330" class="flow-label">PLANNED CONNECTIONS</text>
</svg>
