<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nala-trace-flow-title nala-trace-flow-desc">
  <title id="nala-trace-flow-title">How Nala Trace observes a Codex session</title>
  <desc id="nala-trace-flow-desc">Codex lifecycle events move through the hook client to the Go API, MongoDB, the session API, and the React viewer.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
      .step-number { fill: #2d3142; font-size: 7px; font-weight: 600; }
      .step-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      .lane-label { fill: #4f5d75; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      .role-text { fill: #2d3142; font-size: 6px; font-weight: 600; }
      .node-title { fill: #2d3142; font: 600 9px 'Geist', system-ui, sans-serif; text-anchor: middle; }
      .node-sub { fill: #4f5d75; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
      .node-tool { fill: #7a8399; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
      .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
      .focal-text { fill: #eb6c36; }
      .legend-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      .legend-text { fill: #4f5d75; font: 400 7px 'Geist', system-ui, sans-serif; }
    </style>
    <pattern id="nala-trace-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="nala-trace-flow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
    <marker id="nala-trace-flow-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
    <marker id="nala-trace-flow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="840" height="436" fill="#f5f5f5"/>
  <rect width="840" height="436" fill="url(#nala-trace-flow-dots)"/>
  <rect x="0" y="36" width="840" height="80" fill="rgba(45,49,66,0.018)"/>
  <rect x="0" y="196" width="840" height="80" fill="rgba(45,49,66,0.018)"/>

  <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="356" x2="840" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <g aria-label="Pipeline steps">
    <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">CAPTURE</text>
    <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">DISPATCH</text>
    <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">INGEST</text>
    <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">PERSIST</text>
    <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">REBUILD</text>
    <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">INSPECT</text>
  </g>

  <g aria-label="System lanes">
    <text x="70" y="72" class="lane-label">CODEX</text><text x="70" y="84" class="lane-label">LIFECYCLE</text>
    <text x="70" y="152" class="lane-label">HOOK</text><text x="70" y="164" class="lane-label">CLIENT</text>
    <text x="70" y="232" class="lane-label">NALA</text><text x="70" y="244" class="lane-label">TRACE API</text>
    <text x="70" y="312" class="lane-label">REACT</text><text x="70" y="324" class="lane-label">VIEWER</text>
  </g>

  <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#nala-trace-flow-arr-muted)"/>
  <path d="M358 156 H412 Q420 156 420 164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nala-trace-flow-arr-accent)"/>
  <path d="M470 236 H482" fill="none" stroke="#4f5d75" marker-end="url(#nala-trace-flow-arr-muted)"/>
  <path d="M582 236 H594" fill="none" stroke="#4f5d75" marker-end="url(#nala-trace-flow-arr-muted)"/>
  <path d="M694 236 H748 Q756 236 756 244 V284" fill="none" stroke="#2e5aa8" marker-end="url(#nala-trace-flow-arr-link)"/>
  <rect x="362" y="136" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="392" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT + AUTH</text>

  <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
  <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">COD</text>
  <text x="196" y="67" class="node-title">Hook Event</text><text x="196" y="79" class="node-sub">JSON on stdin</text><text x="196" y="91" class="node-tool">lifecycle hook</text>
  <rect x="226" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="234" y="104" class="chip-text">LS</text>

  <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
  <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="133" class="role-text">HOK</text>
  <text x="308" y="147" class="node-title">hook-client</text><text x="308" y="159" class="node-sub">one bounded POST</text><text x="308" y="171" class="node-tool">bearer auth</text>
  <rect x="262" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="270" y="184" class="chip-text">LS</text>
  <rect x="338" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="346" y="184" class="chip-text">WB</text>

  <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="383" y="213" class="role-text focal-text">API</text>
  <text x="420" y="227" class="node-title">Go API</text><text x="420" y="239" class="node-sub">validate + ingest</text><text x="420" y="251" class="node-tool">POST /ingest</text>
  <rect x="374" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="382" y="264" class="chip-text">WB</text>
  <rect x="450" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="458" y="264" class="chip-text">DB</text>

  <rect x="482" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
  <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="213" class="role-text">DB</text>
  <text x="532" y="227" class="node-title">MongoDB</text><text x="532" y="239" class="node-sub">store hook payloads</text><text x="532" y="251" class="node-tool">trace_events</text>
  <rect x="486" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="494" y="264" class="chip-text">DB</text>
  <rect x="562" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="570" y="264" class="chip-text">DB</text>

  <rect x="594" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
  <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="213" class="role-text">API</text>
  <text x="644" y="227" class="node-title">Session API</text><text x="644" y="239" class="node-sub">reconstruct trace</text><text x="644" y="251" class="node-tool">GET /sessions/:id</text>
  <rect x="598" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="606" y="264" class="chip-text">DB</text>
  <rect x="674" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="264" class="chip-text">WB</text>

  <rect x="706" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
  <rect x="710" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="719" y="293" class="role-text">WEB</text>
  <text x="756" y="307" class="node-title">React viewer</text><text x="756" y="319" class="node-sub">sessions + detail</text><text x="756" y="331" class="node-tool">dashboard</text>
  <rect x="710" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="718" y="344" class="chip-text">WB</text>

  <text x="164" y="373" class="legend-label">STEPS</text>
  <rect x="180" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Capture</text>
  <rect x="272" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="284" y="372" class="step-number">02</text><text x="304" y="373" class="legend-text">Dispatch</text>
  <rect x="376" y="364" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/><text x="388" y="372" class="step-number focal-text">03</text><text x="408" y="373" class="legend-text">Ingest</text>
  <rect x="468" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="480" y="372" class="step-number">04</text><text x="500" y="373" class="legend-text">Persist</text>
  <rect x="560" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="572" y="372" class="step-number">05</text><text x="592" y="373" class="legend-text">Rebuild</text>
  <rect x="660" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="672" y="372" class="step-number">06</text><text x="692" y="373" class="legend-text">Inspect</text>

  <text x="164" y="394" class="legend-label">DATA TYPE</text>
  <rect x="180" y="386" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="188" y="392" class="chip-text">LS</text><text x="202" y="394" class="legend-text">Event</text>
  <rect x="252" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="260" y="392" class="chip-text">DB</text><text x="274" y="394" class="legend-text">Stored data</text>
  <rect x="352" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="360" y="392" class="chip-text">WB</text><text x="374" y="394" class="legend-text">Web payload</text>
  <text x="476" y="394" class="legend-text">left chip = input · right chip = output</text>

  <text x="164" y="415" class="legend-label">FLOW</text>
  <line x1="180" y1="412" x2="204" y2="412" stroke="#4f5d75" marker-end="url(#nala-trace-flow-arr-muted)"/><text x="212" y="415" class="legend-text">Standard handoff</text>
  <line x1="344" y1="412" x2="368" y2="412" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nala-trace-flow-arr-accent)"/><text x="376" y="415" class="legend-text">Authenticated ingest</text>
  <line x1="528" y1="412" x2="552" y2="412" stroke="#2e5aa8" marker-end="url(#nala-trace-flow-arr-link)"/><text x="560" y="415" class="legend-text">Viewer read</text>
</svg>
