server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep client-side routes working on refresh. API paths stay relative in
    # the bundle and are routed by the deployment's ingress/service topology.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
